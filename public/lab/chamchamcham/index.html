<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>손놀이 한판 — SSSOFT 실험실</title>
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
@font-face{font-family:Jalnan;src:url(https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff) format("woff")}
/* 한 화면 게임: 위는 게임 고르기, 가운데 캐릭터 무대, 아래 내 카메라와 인식 상태 */
:root{--bg:#141224;--panel:#1f1c36;--ink:#f6f3ff;--muted:#a9a3c9;--hot:#ff6b4a;--good:#3ddc97;--accent:#ffd34e;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px));overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 6px;gap:8px}
header b{font-family:Jalnan,Pretendard,sans-serif;font-weight:400;font-size:21px;letter-spacing:.02em}
header small{color:var(--muted);font-size:12px}
.hud{display:flex;gap:10px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.hud span b{color:var(--ink);font-size:16px}
.tabs{display:flex;gap:6px;padding:2px 0 4px}
.tabs button{flex:1;font:inherit;font-weight:800;font-size:15px;border:0;border-radius:12px;padding:10px 4px;background:var(--panel);color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--accent);color:#231a00}
.tabs button:disabled{opacity:.5;cursor:default}
#stage{position:relative;flex:1;min-height:0}
#stage canvas{width:100%;height:100%;display:block}
#call{position:absolute;top:5%;left:0;right:0;text-align:center;font-family:Jalnan,Pretendard,sans-serif;font-size:clamp(46px,13vw,116px);
  color:var(--accent);text-shadow:0 6px 0 rgba(0,0,0,.35);pointer-events:none;transition:transform .08s}
#call.pop{transform:scale(1.18)}
#msg{position:absolute;bottom:5%;left:0;right:0;text-align:center;font-size:clamp(17px,4.4vw,27px);font-weight:800;pointer-events:none;min-height:1.3em;padding:0 8px;word-break:keep-all}
#mode{position:absolute;top:0;left:4px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--panel);color:var(--muted)}
footer{display:flex;gap:10px;align-items:stretch;padding:8px 0 12px}
.cam{position:relative;width:32%;max-width:190px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#000;flex:none}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam i{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-style:normal;font-size:12.5px;font-weight:800;background:rgba(0,0,0,.6);padding:2px 10px;border-radius:999px;white-space:nowrap}
.side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:center}
.side p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5;word-break:keep-all}
#start{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:14px;padding:14px;background:var(--hot);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dir{display:flex;gap:4px}
.dir span{flex:1;text-align:center;padding:6px 0;border-radius:8px;background:var(--panel);color:var(--muted);font-weight:800;font-size:13px}
.dir span.on{background:var(--good);color:#0b1a12}
@media (prefers-reduced-motion:reduce){#call{transition:none}}
</style>
</head>
<body>
<header>
  <div><b>손놀이 한판</b> <a href="/" style="color:var(--muted);font-size:12px;text-decoration:none">SSSOFT 실험실</a></div>
  <div class="hud"><span>점수 <b id="score">0</b></span><span>목숨 <b id="lives">3</b></span><span>최고 <b id="best">0</b></span></div>
</header>
<nav class="tabs" aria-label="게임 고르기">
  <button id="g-rps" data-g="rps">가위바위보</button>
  <button id="g-mjb" data-g="mjb">묵찌빠</button>
  <button id="g-ccc" data-g="ccc">참참참</button>
</nav>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="mode">준비</div>
  <div id="call"></div>
  <div id="msg">게임을 고르고 시작하세요</div>
</div>
<footer>
  <div class="cam"><video id="vid" playsinline muted></video><i id="face">카메라 꺼짐</i></div>
  <div class="side">
    <div class="dir"><span id="d0"></span><span id="d1"></span><span id="d2"></span></div>
    <p id="help"></p>
    <button id="start">카메라 켜고 시작</button>
  </div>
</footer>
<script type="module">
import { FaceLandmarker, GestureRecognizer, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), vid = $("vid");
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models";

/* ---------- 게임 정의 ---------- */
const GAMES = {
  rps: { name: "가위바위보", slots: [["S", "가위"], ["R", "바위"], ["P", "보"]], needs: "hand",
    help: "\"가위, 바위, 보!\"의 마지막 박자에 손을 내세요. 주먹은 바위, 편 손은 보, 브이는 가위입니다. 늦게 바꾸면 집니다." },
  mjb: { name: "묵찌빠", slots: [["S", "찌"], ["R", "묵"], ["P", "빠"]], needs: "hand",
    help: "가위바위보로 공격을 정한 뒤 \"묵! 찌! 빠!\"의 마지막 박자에 손을 냅니다. 공격하는 쪽과 같은 걸 내면 공격이 이깁니다." },
  ccc: { name: "참참참", slots: [["L", "왼쪽"], ["C", "가운데"], ["R", "오른쪽"]], needs: "both",
    help: "수비 판은 캐릭터가 가리키는 쪽의 반대로 고개를 돌리고, 공격 판은 손가락으로 한쪽을 가리켜 캐릭터 고개와 같은 쪽이면 이깁니다." },
};
let game = "rps";
try { const g = localStorage.getItem("hand-game"); if (GAMES[g]) game = g; } catch (e) {}

/* ---------- 인식 ---------- */
let face = null, hands = null, files = null;
let headDir = "C", handShape = "", handDir = "C", seenFace = 0, seenHand = 0;
let readHead = false, readHand = false;
// 고개: 코끝(1)이 양 볼(234, 454) 사이 어디인지. 거울 화면 기준으로 맞춘다
function dirOfHead(lm) {
  const t = (lm[1].x - lm[234].x) / (lm[454].x - lm[234].x) - 0.5;
  return t > 0.14 ? "L" : t < -0.14 ? "R" : "C";
}
// 손가락: 검지 끝(8)이 검지 뿌리(5)에서 옆으로 뻗은 정도. 거울 화면 기준
function dirOfFinger(lm) {
  const dx = lm[8].x - lm[5].x;
  return dx > 0.06 ? "L" : dx < -0.06 ? "R" : "C";
}
// 손 모양: 인식기의 이름을 바위(R)·보(P)·가위(S)로
const SHAPE = { Closed_Fist: "R", Open_Palm: "P", Victory: "S" };
function slotOn() {
  const g = GAMES[game];
  const v = game === "ccc" ? (readHand ? handDir : headDir) : handShape;
  g.slots.forEach(([k], i) => $("d" + i).classList.toggle("on", v === k));
}
function sense() {
  if (vid.readyState < 2) return;
  const now = performance.now();
  if (readHead && face) {
    const r = face.detectForVideo(vid, now);
    if (r.faceLandmarks?.length) { headDir = dirOfHead(r.faceLandmarks[0]); seenFace = now; $("face").textContent = "얼굴 인식 중"; }
    else if (now - seenFace > 600) { headDir = "C"; $("face").textContent = "얼굴이 안 보여요"; }
  }
  if (readHand && hands) {
    const r = hands.recognizeForVideo(vid, now + 0.5);
    if (r.landmarks?.length) {
      seenHand = now;
      handDir = dirOfFinger(r.landmarks[0]);
      const top = r.gestures?.[0]?.[0];
      handShape = top && top.score > 0.5 ? (SHAPE[top.categoryName] || "") : "";
      $("face").textContent = handShape ? "손 인식 중" : "손 모양을 또렷하게";
    } else if (now - seenHand > 400) { handShape = ""; handDir = "C"; $("face").textContent = "손을 보여 주세요"; }
  }
  slotOn();
}
async function ensureModels() {
  files ||= await FilesetResolver.forVisionTasks(MP);
  if (!hands) hands = await GestureRecognizer.createFromOptions(files, {
    baseOptions: { modelAssetPath: `${MODEL}/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task`, delegate: "GPU" },
    runningMode: "VIDEO", numHands: 1,
  });
  if (!face) face = await FaceLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: `${MODEL}/face_landmarker/face_landmarker/float16/1/face_landmarker.task`, delegate: "GPU" },
    runningMode: "VIDEO", numFaces: 1,
  });
}

/* ---------- 소리 ---------- */
let ac = null;
function beep(f, d = 0.12, type = "square", vol = 0.12) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f; g.gain.value = vol;
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
}

/* ---------- 캐릭터 ---------- */
// face·hand: -1 왼쪽 … 1 오른쪽, show: 내민 손 모양(R/P/S), mood: 표정
const ch = { face: 0, faceGoal: 0, hand: 0, handGoal: 0, show: "", shake: 0, mood: "idle", bounce: 0 };
function fit() {
  const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
  cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener("resize", fit);
const SKIN = "#ffd9b8", INK = "#1c1430";
function drawFist(x, y, r, shape) {
  // 주먹을 기본으로, 보는 손가락 다섯, 가위는 두 개를 편다
  ctx.fillStyle = SKIN; ctx.strokeStyle = SKIN; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  const up = (ang, len) => { ctx.lineWidth = r * 0.42; ctx.beginPath(); ctx.moveTo(x + Math.cos(ang) * r * 0.5, y + Math.sin(ang) * r * 0.5); ctx.lineTo(x + Math.cos(ang) * (r + len), y + Math.sin(ang) * (r + len)); ctx.stroke(); };
  if (shape === "P") [-2.5, -1.95, -1.57, -1.2, -0.65].forEach((a, i) => up(a, r * (i === 0 || i === 4 ? 0.6 : 0.95)));
  if (shape === "S") { up(-1.85, r * 1.0); up(-1.3, r * 1.0); }
  ctx.strokeStyle = "rgba(28,20,48,.25)"; ctx.lineWidth = r * 0.06;
  if (shape !== "P") for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(x + i * r * 0.32, y - r * 0.55); ctx.lineTo(x + i * r * 0.32, y - r * 0.1); ctx.stroke(); }
}
function draw() {
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);
  ch.face += (ch.faceGoal - ch.face) * 0.35;
  ch.hand += (ch.handGoal - ch.hand) * 0.35;
  ch.bounce *= 0.85; ch.shake *= 0.8;
  const R = Math.min(W * 0.8, H) * 0.22, cx = W / 2 - (ch.show ? R * 0.55 : 0), cy = H * 0.5 - ch.bounce * 12;
  ctx.fillStyle = "#7c5cff";
  ctx.beginPath(); ctx.ellipse(cx, cy + R * 1.35, R * 0.8, R * 0.55, 0, Math.PI, 0); ctx.fill();
  ctx.save(); ctx.translate(cx + ch.face * R * 0.18, cy);
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3b2a5c"; ctx.beginPath(); ctx.arc(0, -R * 0.15, R * 1.02, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  const ex = ch.face * R * 0.28;
  for (const s of [-1, 1]) {
    const x = ex + s * R * 0.36;
    ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.beginPath();
    if (ch.mood === "win") { ctx.lineWidth = R * 0.07; ctx.arc(x, R * 0.05, R * 0.12, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    else if (ch.mood === "lose") { ctx.lineWidth = R * 0.06; ctx.moveTo(x - R * 0.1, -R * 0.02); ctx.lineTo(x + R * 0.1, R * 0.12); ctx.moveTo(x + R * 0.1, -R * 0.02); ctx.lineTo(x - R * 0.1, R * 0.12); ctx.stroke(); }
    else { ctx.arc(x, R * 0.05, R * 0.11, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.fillStyle = "rgba(255,120,120,.45)";
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(ex + s * R * 0.58, R * 0.3, R * 0.13, R * 0.08, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.beginPath();
  if (ch.mood === "call") { ctx.ellipse(ex, R * 0.45, R * 0.13, R * 0.16, 0, 0, Math.PI * 2); ctx.fill(); }
  else if (ch.mood === "lose") { ctx.ellipse(ex, R * 0.5, R * 0.15, R * 0.06, 0, 0, Math.PI * 2); ctx.fill(); }
  else { ctx.lineWidth = R * 0.06; ctx.arc(ex, R * 0.35, R * 0.18, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  ctx.restore();
  // 참참참 손가락
  if (Math.abs(ch.hand) > 0.05) {
    const hx = cx + ch.hand * R * 1.55, hy = cy + R * 0.2;
    ctx.strokeStyle = SKIN; ctx.lineWidth = R * 0.22; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx + Math.sign(ch.hand) * R * 0.6, cy + R * 0.95); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(hx, hy, R * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = R * 0.09; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + Math.sign(ch.hand) * R * 0.42, hy - R * 0.05); ctx.stroke();
  }
  // 가위바위보 손: 박자마다 흔들고 마지막에 모양을 편다
  if (ch.show) {
    const hx = cx + R * 1.5, hy = cy + R * 0.35 - ch.shake * R * 0.35;
    ctx.strokeStyle = SKIN; ctx.lineWidth = R * 0.24; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx + R * 0.55, cy + R * 1.0); ctx.lineTo(hx, hy + R * 0.25); ctx.stroke();
    drawFist(hx, hy, R * 0.34, ch.show);
  }
}
function loop() { sense(); draw(); requestAnimationFrame(loop); }

/* ---------- 진행 공통 ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
const st = { score: 0, lives: 3, round: 0, playing: false };
const bestKey = () => "hand-best-" + game;
function getBest() { try { return +localStorage.getItem(bestKey()) || 0; } catch (e) { return 0; } }
function hud() {
  $("score").textContent = st.score; $("lives").textContent = st.lives;
  if (st.score > getBest()) { try { localStorage.setItem(bestKey(), st.score); } catch (e) {} }
  $("best").textContent = Math.max(getBest(), st.score);
}
function call(text, f) {
  const c = $("call"); c.textContent = text; c.classList.add("pop");
  setTimeout(() => c.classList.remove("pop"), 90);
  ch.mood = "call"; ch.bounce = 1; ch.shake = 1; beep(f);
}
function say(t, color) { const m = $("msg"); m.textContent = t; m.style.color = color || "var(--ink)"; }
function result(win) {
  ch.mood = win === null ? "idle" : win ? "lose" : "win"; // 캐릭터는 내가 이기면 억울해한다
  if (win) { st.score++; beep(880, .1, "triangle"); setTimeout(() => beep(1180, .14, "triangle"), 110); }
  else if (win === false) { st.lives--; beep(180, .3, "sawtooth", .1); }
  hud();
}
const beatMs = () => Math.max(330, 600 - st.score * 16);
const BEATS = { R: "S", S: "P", P: "R" }; // 이기는 쪽 → 지는 쪽
const NAME = { R: "바위", P: "보", S: "가위" };
const MJB = { R: "묵", S: "찌", P: "빠" };
// 캐릭터의 버릇: 지고 나면 바위를 조금 더 자주 낸다
let lastCharLost = false;
function charThrow() {
  if (lastCharLost && Math.random() < 0.45) return "R";
  return ["R", "P", "S"][Math.floor(Math.random() * 3)];
}
// 마지막 박자 뒤 내 손을 읽는다. 처음 본 모양과 조금 뒤 모양이 다르면 늦게 바꾼 것
async function readThrow() {
  await wait(330); const a = handShape;
  await wait(320); const b = handShape;
  if (!a && !b) return { late: true, shape: "" };
  if (a && b && a !== b) return { changed: true, shape: b };
  return { shape: a || b };
}
function judge(me, it) { return me === it ? 0 : BEATS[me] === it ? 1 : -1; }

/* ---------- 가위바위보 ---------- */
async function throwOnce(words) {
  ch.show = "R"; ch.faceGoal = 0; ch.handGoal = 0;
  const b = beatMs();
  call(words[0], 520); await wait(b);
  call(words[1], 520); await wait(b);
  const it = charThrow();
  call(words[2], 780); ch.show = it;
  const r = await readThrow();
  return { it, ...r };
}
async function roundRps() {
  $("mode").textContent = "가위바위보";
  say("주먹을 쥐고 준비하세요", "var(--muted)");
  ch.mood = "idle"; await wait(800);
  const r = await throwOnce(["가위", "바위", "보!"]);
  if (r.late) { say("손이 안 보였어요!", "var(--hot)"); result(false); lastCharLost = false; }
  else if (r.changed) { say("늦게 바꿨다! 반칙", "var(--hot)"); result(false); lastCharLost = false; }
  else {
    const j = judge(r.shape, r.it);
    say(`나: ${NAME[r.shape]} · 캐릭터: ${NAME[r.it]} — ${j > 0 ? "이겼다!" : j < 0 ? "졌다" : "비겼다"}`, j > 0 ? "var(--good)" : j < 0 ? "var(--hot)" : "var(--accent)");
    result(j > 0 ? true : j < 0 ? false : null); lastCharLost = j > 0;
  }
  await wait(1300); $("call").textContent = "";
}

/* ---------- 묵찌빠 ---------- */
async function roundMjb() {
  $("mode").textContent = "묵찌빠: 공격 정하기";
  say("가위바위보로 공격을 정해요", "var(--muted)"); ch.mood = "idle"; await wait(800);
  let attacker = null; // "me" | "it"
  while (!attacker) {
    const r = await throwOnce(["가위", "바위", "보!"]);
    // 손을 안 내거나 늦게 바꾸면 무한히 다시 하지 않고 한 판 진 것으로 친다
    if (r.late || r.changed) { say(r.late ? "손이 안 보였어요!" : "늦게 바꿨다! 반칙", "var(--hot)"); result(false); lastCharLost = false; await wait(1300); $("call").textContent = ""; return; }
    const j = judge(r.shape, r.it);
    if (j === 0) { say("비겼다! 다시", "var(--accent)"); await wait(900); continue; }
    attacker = j > 0 ? "me" : "it";
  }
  for (let turn = 0; turn < 8; turn++) {
    $("mode").textContent = attacker === "me" ? "묵찌빠: 내 공격" : "묵찌빠: 캐릭터 공격";
    say(attacker === "me" ? "내 공격! 캐릭터와 같은 걸 내면 이겨요" : "캐릭터 공격! 같은 걸 내면 져요", attacker === "me" ? "var(--good)" : "var(--hot)");
    await wait(900);
    const r = await throwOnce(["묵!", "찌!", "빠!"]);
    if (r.late || r.changed) { say(r.late ? "손이 안 보였어요!" : "늦게 바꿨다! 반칙", "var(--hot)"); result(false); lastCharLost = false; break; }
    if (r.shape === r.it) {
      const win = attacker === "me";
      say(`둘 다 ${MJB[r.it]}! ${win ? "내가 이겼다!" : "잡혔다"}`, win ? "var(--good)" : "var(--hot)");
      result(win); lastCharLost = win; break;
    }
    const j = judge(r.shape, r.it);
    attacker = j > 0 ? "me" : "it";
    say(`나: ${MJB[r.shape]} · 캐릭터: ${MJB[r.it]} — ${attacker === "me" ? "공격권 가져옴" : "공격권 넘어감"}`, "var(--accent)");
    await wait(1000);
  }
  await wait(1300); $("call").textContent = "";
}

/* ---------- 참참참 ---------- */
async function roundCcc() {
  st.round++;
  const attack = st.round % 2 === 0;
  readHead = !attack; readHand = attack; handDir = "C";
  ch.show = ""; ch.faceGoal = 0; ch.handGoal = 0; ch.mood = "idle";
  $("mode").textContent = attack ? "공격: 손가락으로 가리키기!" : "수비: 손가락 반대쪽으로!";
  say(attack ? "손을 보이고, 참!에 맞춰 손가락으로 한쪽을 가리키세요" : "참!에 맞춰 손가락 반대쪽으로 고개를 돌리세요", "var(--muted)");
  await wait(900);
  const b = beatMs(), go = Math.random() < 0.5 ? "L" : "R", sg = d => (d === "L" ? -1 : 1);
  call("참", 520); ch.shake = 0; await wait(b);
  call("참", 520); ch.shake = 0; await wait(b);
  if (!attack && Math.random() < Math.min(0.5, st.score * 0.05)) { ch.handGoal = -sg(go) * 0.5; await wait(120); }
  call("참!", 780); ch.shake = 0;
  if (attack) ch.faceGoal = sg(go); else ch.handGoal = sg(go);
  await wait(380);
  const me = attack ? handDir : headDir;
  let win;
  if (me === "C") { say(attack ? "늦었어요! 손가락으로 가리켜야 해요" : "늦었어요! 고개를 돌려야 해요", "var(--hot)"); win = false; }
  else if (attack) { win = me === go; say(win ? "맞혔다! +1" : "빗나갔어요", win ? "var(--good)" : "var(--hot)"); }
  else { win = me !== go; say(win ? "피했다! +1" : "걸렸다!", win ? "var(--good)" : "var(--hot)"); }
  result(win);
  await wait(1100); $("call").textContent = "";
}

/* ---------- 시작 ---------- */
function choose(g) {
  if (st.playing) return;
  game = g; try { localStorage.setItem("hand-game", g); } catch (e) {}
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.g === g));
  GAMES[g].slots.forEach(([, label], i) => { $("d" + i).textContent = label; });
  $("help").textContent = GAMES[g].help;
  readHead = g === "ccc"; readHand = g !== "ccc";
  ch.show = g === "ccc" ? "" : "R"; ch.faceGoal = 0; ch.handGoal = 0; ch.mood = "idle";
  st.score = 0; st.lives = 3; hud();
  say(`${GAMES[g].name}: 시작을 누르세요`, "var(--muted)"); $("mode").textContent = GAMES[g].name;
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => choose(b.dataset.g)));

async function play() {
  st.playing = true; st.score = 0; st.lives = 3; st.round = 0; lastCharLost = false; hud();
  document.querySelectorAll(".tabs button").forEach(b => (b.disabled = true));
  $("start").hidden = true;
  const one = { rps: roundRps, mjb: roundMjb, ccc: roundCcc }[game];
  while (st.lives > 0) await one();
  $("mode").textContent = "끝";
  say(`끝! ${GAMES[game].name} 점수 ${st.score}`, "var(--accent)");
  ch.faceGoal = 0; ch.handGoal = 0; ch.mood = "win";
  readHead = game === "ccc"; readHand = game !== "ccc";
  st.playing = false;
  document.querySelectorAll(".tabs button").forEach(b => (b.disabled = false));
  $("start").textContent = "다시 하기"; $("start").hidden = false;
}

$("start").addEventListener("click", async () => {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (!vid.srcObject || !hands || !face) {
    $("start").disabled = true; $("start").textContent = "준비 중…";
    try {
      if (!vid.srcObject) {
        vid.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 }, audio: false });
        await vid.play();
      }
    } catch (e) {
      say("카메라를 켤 수 없어요. 브라우저에서 카메라 권한을 허용해 주세요", "var(--hot)");
      $("start").disabled = false; $("start").textContent = "카메라 켜고 시작"; return;
    }
    try { await ensureModels(); }
    catch (e) {
      say("인식 기능을 불러오지 못했어요. 새로고침해 주세요", "var(--hot)");
      $("start").disabled = false; $("start").textContent = "다시 시도"; return;
    }
    $("start").disabled = false;
    say(game === "ccc" ? "고개를 좌우로 돌려 보세요. 아래 칸이 따라 바뀌면 준비 끝" : "주먹·편 손·브이를 해 보세요. 아래 칸이 따라 바뀌면 준비 끝", "var(--muted)");
    await wait(2400);
  }
  play();
});

choose(game);
fit();
requestAnimationFrame(loop);
</script>
