name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sitemap.xml lastmod를 커밋 날짜로 정하기 위해 전체 기록이 필요
      - name: Build app pages
        run: node scripts/apps.cjs
      - name: Build sitemap.xml
        run: node scripts/sitemap.cjs
      - name: Check secret
        id: secret
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SSSOFT_PORTFOLIO }}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_SSSOFT_PORTFOLIO secret is not set; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secret.outputs.ok == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SSSOFT_PORTFOLIO }}
          projectId: sssoft-portfolio
          channelId: live
