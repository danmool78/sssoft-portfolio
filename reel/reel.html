<!doctype html>
<html lang="ko"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
@font-face{font-family:Jalnan;src:url(https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff) format("woff")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#07080c;font-family:"Noto Sans KR",sans-serif;color:#fff}
#st{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;inset:0;display:none}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center}
.grad{background:linear-gradient(90deg,#5b7bff,#c084fc 50%,#ff8a65);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{font-weight:900;letter-spacing:-.03em;line-height:1.1;text-align:center}
.en{font-family:"Space Grotesk",sans-serif;font-weight:700;letter-spacing:-.02em}
#bg{position:absolute;inset:0}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#grain{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(#fff 1px,transparent 1.2px);background-size:6px 6px;pointer-events:none}
/* s1 */
#logo{width:360px;height:360px;filter:drop-shadow(0 30px 80px rgba(168,85,247,.6))}
#rays{position:absolute;left:50%;top:50%;width:0;height:0}
#rays i{position:absolute;left:0;top:0;width:12px;height:340px;margin-left:-6px;border-radius:6px;background:linear-gradient(#fff,rgba(255,255,255,0));transform-origin:50% 0}
#word{margin-top:70px;font-size:150px;display:flex;gap:4px}
#word span{display:inline-block}
/* s2 */
.line{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:-.03em}
/* s4 */
#phone{position:absolute;width:640px;left:220px;top:470px;border-radius:70px;border:16px solid #0b0b0f;background:#0b0b0f;overflow:hidden;box-shadow:0 60px 140px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.08)}
#phone img{display:block;width:100%;height:1150px;object-fit:cover;object-position:top}
#appname{position:absolute;left:60px;right:60px;top:150px;font-size:118px;font-weight:900;letter-spacing:-.03em;line-height:1}
#apptag{position:absolute;left:60px;top:110px;font-family:"Space Grotesk",sans-serif;font-size:34px;font-weight:700;letter-spacing:.12em}
#shade{position:absolute;left:0;right:0;bottom:0;height:620px;background:linear-gradient(to top,rgba(7,8,12,.94) 38%,rgba(7,8,12,0))}
#hook{position:absolute;left:60px;right:60px;bottom:170px;font-size:66px;font-weight:900;line-height:1.2;letter-spacing:-.02em;text-shadow:0 8px 30px rgba(0,0,0,.5)}
#counter{position:absolute;right:60px;top:60px;font-family:"Space Grotesk",sans-serif;font-size:40px;font-weight:700;opacity:.7}
#bar{position:absolute;left:0;bottom:0;height:14px;background:#fff}
/* s5 */
.stat{position:absolute;left:0;right:0;text-align:center}
.stat b{display:block;font-family:"Space Grotesk",sans-serif;font-size:250px;line-height:1;font-weight:700}
.stat small{display:block;font-size:56px;font-weight:700;opacity:.85;margin-top:6px}
/* s6 */
#cta1{font-size:92px}
#cta2{font-size:110px;margin-top:30px}
#url{margin-top:120px;font-family:"Space Grotesk",sans-serif;font-size:62px;font-weight:700;padding:26px 54px;border-radius:999px;background:#fff;color:#111}
#ctalogo{display:flex;align-items:center;gap:26px;margin-bottom:120px}
#ctalogo img{width:150px}
#ctalogo span{font-family:"Space Grotesk",sans-serif;font-size:96px;font-weight:700}

html,body{font-family:Pretendard,"Noto Sans KR",sans-serif}
.big,.line,#appname,#hook,#slogan,.stat small,#cta1,#cta2{font-family:Jalnan,Pretendard,sans-serif;font-weight:400}
#slogan{letter-spacing:-.01em}
#sloganSub,#apptag{font-family:Pretendard,sans-serif;font-weight:800}
</style></head>
<body><div id="st">
<div id="bg"></div>

<div class="layer center" id="s1">
  <div id="rays"></div>
  <img id="logo" src="logo-mark.svg">
  <div id="word" class="en"></div>
</div>

<div class="layer" id="s2">
  <div class="line" id="l1" style="font-size:104px;top:620px">엑셀로 버티던 일,</div>
  <div class="line" id="l2" style="font-size:104px;top:790px">카톡으로 돌리던 일,</div>
  <div class="line grad" id="l3" style="font-size:190px;top:1010px">앱 하나로.</div>
</div>

<div class="layer center" id="s3">
  <div class="big en" id="slogan" style="font-size:210px"></div>
  <div id="sloganSub" style="font-size:60px;font-weight:700;margin-top:30px;opacity:.9"></div>
</div>

<div class="layer" id="s4">
  <div id="counter"></div>
  <div id="apptag"></div>
  <div id="appname"></div>
  <div id="phone"><img id="shot"></div>
  <div id="shade"></div><div id="hook"></div>
  <div id="bar"></div>
</div>

<div class="layer" id="s5"></div>

<div class="layer center" id="s6">
  <div id="ctalogo"><img src="logo-mark.svg"><span><span class="grad">SSS</span>OFT</span></div>
  <div class="big" id="cta1">함께 만들 거,<br>있으세요?</div>
  <div class="big" id="cta2"><span class="grad">단, 재미있어야<br>합니다</span></div>
  <div id="url">sssoft-idea.web.app</div>
</div>

<div id="flash"></div><div id="grain"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eBack=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const eIn=x=>x*x*x;
const show=id=>{["s1","s2","s3","s4","s5","s6"].forEach(s=>$(s).style.display=s===id?(s==="s1"||s==="s3"||s==="s6"?"flex":"block"):"none")};
// rays
for(let i=0;i<12;i++){const r=document.createElement("i");r.style.transform=`rotate(${i*30}deg)`;$("rays").appendChild(r);}
"SSSOFT".split("").forEach((c,i)=>{const s=document.createElement("span");s.textContent=c;if(i<3)s.className="grad";$("word").appendChild(s);});
const APPS=[
 ["CAMP MASTER","캠프마스터","등록부터 명찰·정산까지\n캠프 운영을 앱 하나로","campmaster.png","#4f8cff"],
 ["STARFARER","STARFARER","브라우저에서 바로 출격,\n실시간 우주 MMO","starfarer-play.png","#ff9a2e","center"],
 ["STARFARER · COCKPIT","STARFARER","조종석에서 펼쳐지는\n심우주 탐사","starfarer-cockpit.png","#f97316","42% center"],
 ["SRN PRAYER","다락방 기도앱","새벽 5시,\n오늘의 큐티가 도착합니다","darakbang.png","#7c5cff"],
 ["CHURCH REC","교회 레크리에이션","실전 216명이\n휴대폰 하나로 함께","gyogurec.jpg","#ff8a3d","40% center"],
 ["AI AUDIOBOOK","다정 리딩북","원어 판본 고전 36,842권,\n6개 언어 AI 오디오북","readingbook.png","#5b9a6e"],
 ["INDEPENDENT MALL","나만의 독립몰","SEO·AEO까지\n검색과 AI가 먼저 찾는 몰","chemimall.png","#d42a3f"],
 ["VOCABSCAN","보캐브스캔","찍으면 단어장,\n17개 언어로 공부","vocab.png","#e01e1e"],
 ["WORD DROP","워드드롭","떨어지기 전에\n떠올려라!","worddrop.png","#8b5cf6"],
 ["RETIREMENT","노후자금 시뮬레이터","부부 연금 5종,\n한 번에 계산하는 리포트","retire.png","#1d4ed8"],
 ["BALANCE KEEPER","중심잡기","폰을 기울여\n중심을 잡아라","balance.png","#3f9b5a"],
 ["QT RACE","큐티레이스","반별 큐티 기록이\n대형 화면의 레이스로","qtrace.jpg","#ff6b6b"],
 ["KINGS CHRONICLE","열왕기","두 왕국 345년을\n한 장의 연대표로","kings.png","#2f5d4f"],
 ["THE WAY","그 길","지도 위를 걸으며 만나는\n예수의 생애 61장면","theway.png","#a8792a"],
 ["VISION QUEST","비전 퀘스트","걸으며 푸는 팀 미션 6종,\n실시간 3D 지도 위에서","visionquest.png","#3d7be0"],
];
const STATS=[["14","완성형 창작물"],["490+","창작물에 담긴 기능"],["17+","지원 언어"]];
STATS.forEach((s,i)=>{const d=document.createElement("div");d.className="stat";d.id="st"+i;d.innerHTML=`<b class="grad"></b><small>${s[1]}</small>`;d.style.top=(330+i*450)+"px";$("s5").appendChild(d);});
const T={s1:[0,2.2],s2:[2.2,4.8],s3:[4.8,7.0],s4:[7.0,25.5],s5:[25.5,28.1],s6:[28.1,32]};
window.DURATION=32;
function bgSet(css){$("bg").style.background=css}
function flash(t,at,d=.18){const x=p(t,at,at+d);return x>0&&x<1?(1-x)*.85:0}
window.render=function(t){
  let fl=0;
  if(t<T.s1[1]){show("s1");
    bgSet(`radial-gradient(70% 45% at 50% 45%, rgba(124,92,255,${.25+.35*eOut(p(t,0,1))}), #07080c 70%)`);
    const a=eBack(p(t,.1,.9));$("logo").style.transform=`scale(${a}) rotate(${(1-a)*-120}deg)`;$("logo").style.opacity=p(t,.1,.3);
    const r=p(t,.55,1.3);$("rays").style.transform=`scale(${.2+eOut(r)*1.6}) rotate(${t*30}deg)`;$("rays").style.opacity=r>0?(1-r):0;$("rays").style.top="calc(50% - 110px)";
    [...$("word").children].forEach((s,i)=>{const x=eBack(p(t,.9+i*.08,1.25+i*.08));s.style.transform=`translateY(${(1-x)*-260}px)`;s.style.opacity=p(t,.9+i*.08,1.0+i*.08);});
    fl=flash(t,.55)+flash(t,0,.25);
    const z=p(t,1.9,2.2);$("s1").style.transform=`scale(${1+eIn(z)*2.5})`;$("s1").style.opacity=1-z;
  } else if(t<T.s2[1]){show("s2");const u=t-T.s2[0];
    bgSet("#07080c");
    [["l1",0],["l2",.6],["l3",1.25]].forEach(([id,a],i)=>{const x=p(u,a,a+.32);const e=eBack(x);const el=$(id);
      el.style.opacity=x>0?1:0;el.style.transform=`translateX(${(1-e)*(i%2?1100:-1100)}px) scale(${i==2?1+(1-eOut(x))*.6:1}) rotate(${i==2?(1-e)*-8:0}deg)`;
      if(i<2&&u>1.25){el.style.opacity=1-p(u,1.25,1.5)*.65;}});
    fl=flash(u,1.25,.2)*.7;
    const sh=p(u,1.25,1.6);$("s2").style.transform=sh>0&&sh<1?`translate(${Math.sin(u*90)*18*(1-sh)}px,${Math.cos(u*70)*14*(1-sh)}px)`:"none";
  } else if(t<T.s3[1]){show("s3");const u=t-T.s3[0];
    const W=[["Spark it.","아이디어에 불을 붙이고","#ff6b3d","#ffb547"],["Shape it.","써 보며 모양을 빚고","#7c5cff","#c084fc"],["Ship it.","세상에 내보냅니다","#2f6bff","#29d3c2"]];
    const k=Math.min(2,Math.floor(u/.73));const lu=u-k*.73;const w=W[k];
    bgSet(`linear-gradient(160deg,${w[2]},${w[3]})`);
    $("slogan").textContent=w[0];$("sloganSub").textContent=w[1];
    const x=eBack(p(lu,0,.28));$("slogan").style.transform=`scale(${.4+x*.6}) rotate(${(1-x)*-6}deg)`;
    $("sloganSub").style.opacity=p(lu,.12,.3);$("sloganSub").style.transform=`translateY(${(1-eOut(p(lu,.12,.35)))*40}px)`;
    fl=flash(lu,0,.14)*.6;
  } else if(t<T.s4[1]){show("s4");const u=t-T.s4[0];const D=(T.s4[1]-T.s4[0])/APPS.length;
    const k=Math.min(APPS.length-1,Math.floor(u/D));const lu=u-k*D;const a=APPS[k];const side=k%2?1:-1;
    bgSet(`radial-gradient(90% 60% at ${50+side*20}% 40%, ${a[4]}, #07080c 75%)`);
    $("counter").textContent=String(k+1).padStart(2,"0")+" / "+String(APPS.length).padStart(2,"0");
    $("apptag").textContent=a[0];$("appname").textContent=a[1];if($("appname").dataset.k!=k){const n=$("appname");n.dataset.k=k;n.style.whiteSpace="nowrap";let f=118;n.style.fontSize=f+"px";while(n.scrollWidth>n.clientWidth&&f>60){f-=2;n.style.fontSize=f+"px";}}$("hook").innerHTML=a[2].replace("\n","<br>");
    if($("shot").dataset.k!=k){$("shot").src=a[3];$("shot").dataset.k=k;$("shot").style.objectPosition=a[5]||"top";}
    const inx=eOut(p(lu,0,.35)), out=eIn(p(lu,D-.22,D));
    $("phone").style.transform=`translateX(${(1-inx)*side*900 - out*side*-900}px) rotate(${(1-inx)*side*14 + out*side*-10 + Math.sin(lu*2)*1.2}deg) scale(${.94+inx*.06})`;
    const nx=eBack(p(lu,.05,.4));$("appname").style.transform=`translateX(${(1-nx)*-side*700}px)`;$("appname").style.opacity=1-out;
    $("apptag").style.opacity=p(lu,.1,.3)*(1-out);
    $("hook").style.opacity=p(lu,.3,.5)*(1-out);$("hook").style.transform=`translateY(${(1-eOut(p(lu,.3,.55)))*60}px)`;
    $("bar").style.width=(u/(T.s4[1]-T.s4[0])*100)+"%";$("bar").style.background=a[4];
    fl=flash(lu,0,.12)*.35;
  } else if(t<T.s5[1]){show("s5");const u=t-T.s5[0];
    bgSet("radial-gradient(80% 60% at 50% 50%, #241a4a, #07080c 75%)");
    STATS.forEach((s,i)=>{const d=$("st"+i);const x=p(u,i*.45,i*.45+.6);const n=parseInt(s[0]);const suf=s[0].replace(/[0-9]/g,"");
      d.querySelector("b").textContent=Math.round(n*eOut(x))+(x>=1?suf:"");d.style.opacity=x>0?1:0;d.style.transform=`scale(${.6+eBack(clamp(x*1.4))*.4})`;});
    fl=flash(u,0,.15)*.5;
  } else {show("s6");const u=t-T.s6[0];
    bgSet(`radial-gradient(90% 60% at 50% 45%, rgba(124,92,255,.55), #07080c 75%)`);
    const l=eBack(p(u,0,.4));$("ctalogo").style.transform=`scale(${l})`;$("ctalogo").style.opacity=p(u,0,.15);
    $("cta1").style.opacity=p(u,.3,.5);$("cta1").style.transform=`translateY(${(1-eOut(p(u,.3,.6)))*80}px)`;
    const c=eBack(p(u,.9,1.3));$("cta2").style.opacity=p(u,.9,1.0);$("cta2").style.transform=`scale(${.5+c*.5}) rotate(${(1-c)*-6}deg)`;
    const r=eBack(p(u,1.6,2.0));$("url").style.opacity=p(u,1.6,1.7);$("url").style.transform=`translateY(${(1-r)*200}px) scale(${1+Math.max(0,Math.sin((u-2)*4))*.04*(u>2)})`;
    fl=flash(u,0,.2)*.6+flash(u,.9,.15)*.4;
  }
  $("flash").style.opacity=Math.min(.9,fl);
};
window.ready=Promise.all([document.fonts.ready,...APPS.map(a=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=a[3];}))]);
</script></body></html>
